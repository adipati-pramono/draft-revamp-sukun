<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1,viewport-fit=cover">
<title>Input Sample — SWI Sales 2.0</title>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body class="screen">
<div class="app" data-nav="none" data-screen="jual-sample">
  <header class="appbar">
    <a class="iconbtn" href="14-jualdetail.html" aria-label="Kembali"><svg class="ic"><use href="#i-back"/></svg></a>
    <div class="appbar-t"><h1>Input Sample</h1><p>Toko Sinar Jaya</p></div>
    <span class="spacer"></span>
    <span class="badge violet">Sample</span>
  </header>

  <main class="scroll">
    <div class="banner info">
      <svg class="ic"><use href="#i-gift"/></svg>
      <span>Sample tidak menambah total penjualan, tetapi tercatat sebagai bonus outlet.</span>
    </div>

    <div class="label mt16">Brand</div>
    <div class="brandsel">
      <span class="bmark">DSS<br>234</span>
      <div class="grow">
        <div class="bt">Dji Sam Soe 234</div>
        <div class="bs">Sisa sample 12 bks</div>
      </div>
      <svg class="ic chev"><use href="#i-chevron-down"/></svg>
    </div>

    <div class="section">
      <div class="card">
        <div class="between mb12">
          <div class="card-title"><svg class="ic"><use href="#i-gift"/></svg>Jumlah sample</div>
          <span class="badge violet">Bonus</span>
        </div>
        <div class="stepper">
          <button class="step-btn" type="button" data-step="-"><svg class="ic"><use href="#i-minus"/></svg></button>
          <div class="step-val" data-qty>1<small>bks</small></div>
          <button class="step-btn" type="button" data-step="+"><svg class="ic"><use href="#i-plus"/></svg></button>
        </div>
        <div class="hintline">Sisa sample setelah input: 11 bks.</div>
      </div>
    </div>

    <div class="section">
      <div class="card flat">
        <div class="row">
          <span class="itile i-green"><svg class="ic"><use href="#i-navigation"/></svg></span>
          <div class="grow"><div class="t">Akurasi GPS ±7 m</div><div class="s">Titik outlet cocok · 09.21 WIB</div></div>
          <span class="badge green">Sesuai</span>
        </div>
      </div>
    </div>
  </main>

  <div class="ctabar">
    <button class="btn primary block" type="button"><svg class="ic"><use href="#i-check"/></svg>Simpan Sample</button>
  </div>
</div>
<script src="../assets/sprite.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
